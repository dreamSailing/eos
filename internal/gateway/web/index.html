<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EOS Daemon Console</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>EOS Daemon Console</h1>
      <p>通过统一网关查看后台状态、MCP 会话、任务与定时任务。</p>
    </header>

    <section class="panel">
      <h2>运行状态</h2>
      <pre id="status">加载中...</pre>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>Sessions</h2>
        <button data-action="refresh-sessions">刷新</button>
        <pre id="sessions">加载中...</pre>
      </div>
      <div class="panel">
        <h2>待处理提示</h2>
        <button data-action="refresh-prompts">刷新</button>
        <pre id="prompts">加载中...</pre>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>后台任务</h2>
        <button data-action="refresh-tasks">刷新</button>
        <pre id="tasks">加载中...</pre>
      </div>
      <div class="panel">
        <h2>定时任务</h2>
        <button data-action="refresh-schedules">刷新</button>
        <pre id="schedules">加载中...</pre>
      </div>
    </section>

    <section class="panel">
      <h2>新建定时任务</h2>
      <form id="schedule-form">
        <label>名称<input name="name" required></label>
        <label>Cron<input name="cron" placeholder="*/5 * * * *" required></label>
        <label>类型
          <select name="kind">
            <option value="shell">shell</option>
            <option value="eos_call">eos_call</option>
          </select>
        </label>
        <label>工作区<input name="workspace" placeholder="留空使用默认工作区"></label>
        <label>命令 / 工具<input name="target" required></label>
        <label>参数(JSON，可选)<textarea name="parameters" rows="4" placeholder='{"path":"README.md"}'></textarea></label>
        <label class="checkbox"><input type="checkbox" name="enabled" checked> 启用</label>
        <button type="submit">创建任务</button>
      </form>
      <div id="form-result"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
