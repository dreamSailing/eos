name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        # golang.design/x/clipboard 在 Linux 通过 cgo 绑定 X11 剪贴板，
        # 编译需要 X11 头文件；eos-cli 虽仅 Windows 分发，但 Linux job
        # 仍跑 go build/vet/test 验证编译，必须装 libx11-dev。
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -timeout 300s

  # Windows：eos-cli 目前仅 Windows 分发，验证 Windows 编译。
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build (Windows)
        run: go build ./...
      - name: Test (Windows)
        run: go test ./... -timeout 300s
